[package]
name = "dangle"
version = "0.1.0"
edition = "2024"
license = "MIT"
keywords = ["lint", "dead-code", "cleanup", "diagnostics"]
categories = ["development-tools", "text-editors"]
description = "Dead code detector powered by tree-sitter"
readme = "README.md"
homepage = "https://github.com/wbbradley/dangle"
repository = "https://github.com/wbbradley/dangle"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
streaming-iterator = "0.1.9"
tree-sitter = "0.26.5"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
